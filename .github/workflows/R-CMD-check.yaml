name: R CMD check

on:
  push:
    branches: [package-release]
  pull_request:
    branches: [package-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R ${{ matrix.r }} on Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: release
          - r: '4.1.0'
            cran: https://packagemanager.posit.co/cran/2024-03-01

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          cran: ${{ matrix.cran }}
          use-public-rspm: ${{ matrix.r == 'release' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-pandoc: 'true'

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: 'true'
